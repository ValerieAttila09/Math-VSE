[project]
name = "mathvse"
version = "0.1.0"
description = "MathVSE local-first mathematical image solver and explainer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "sympy>=1.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
