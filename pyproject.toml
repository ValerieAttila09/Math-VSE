[project]
name = "mathvse"
version = "0.1.0"
description = "MathVSE local-first mathematical image solver and explainer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "pillow>=10.0",
  "streamlit>=1.36",
  "sympy>=1.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
training = [
  "torch>=2.2",
]

[project.scripts]
mathvse-recognition = "mathvse.recognition.training:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
